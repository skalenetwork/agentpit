# Production stack — single instance, one shared server-side .env at the repo
# root (compose --env-file AND deploy_exchange.sh read it). There is no chain
# node in here: the api and chain-init both talk to the chain at RPC_URL, SKALE
# on Base mainnet (1187947933) since 2026-10-12.
#
#   cd /root/dev/agentpit-mainnet
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env build
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d postgres
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env run --rm chain-init
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d api caddy
#
# chain-init is for a fresh box ONLY: it deploys a new set of contracts and
# rewrites deployments/local.json, orphaning every market and position the
# database knows. An update is `build api caddy` then `up -d --no-deps api caddy`.
#
# On a fresh box, create the two external caddy volumes first (see `volumes:`
# at the bottom):
#
#   docker volume create agentpit_caddy_data
#   docker volume create agentpit_caddy_config
#
# Only caddy publishes ports (80, 443, 8000); postgres stays on the internal
# network.
#
# The project name is in every container and volume name -- the database lives
# in `agentpit-mainnet_agentpit_pg`. Rename it and compose starts an empty
# Postgres beside the real one. `agentpit` was the SKALE testnet stack, which
# still runs from /root/dev/agentpit: never pull this file into that clone, or
# its compose commands land on the mainnet project.
name: agentpit-mainnet

# Log rotation is NOT optional. While the house re-quoted ~1000 books
# (~170 lines/s) two json logs reached 32 GB and 24 GB in 12 days and filled
# the disk to 97%, which would have taken Postgres down with it. 50m x 3 per
# service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: agentpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: agentpit
    volumes:
      - agentpit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpit"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: deploys CTF + AgentpitUSD + Faucet + CTFExchange to the chain at
  # RPC_URL and writes deployments/local.json into the bind-mounted repo. It
  # reads PK, ADMIN and RPC_URL by sourcing the repo's .env itself, and PK pays
  # the gas, so fund it first. Run once per fresh chain (profile keeps it out of
  # plain `up`).
  chain-init:
    profiles: ["init"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.chain-init
    command: ["scripts/deploy_exchange.sh"]
    volumes:
      - ..:/repo

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    environment:
      AGENTPIT_DATABASE_URL: postgresql://agentpit:${POSTGRES_PASSWORD}@postgres:5432/agentpit
      # Required, never defaulted. This line used to be a bare
      # `http://anvil:8545`, and an `environment:` entry beats `env_file`, so a
      # deployment that had moved to a real chain in .env silently kept talking
      # to the old anvil sidecar. On the SKALE cutover that surfaced as
      # `Connected chain_id 31337 != deployment chain_id 324705682` -- caught
      # only because `verify_chain()` refuses to start on a mismatch. There is
      # no sidecar left to default to, and guessing a chain is how that bug
      # happened, so `:?` makes compose refuse every command while .env lacks
      # the line.
      RPC_URL: ${RPC_URL:?set in .env}
    volumes:
      - ../deployments:/app/deployments:ro
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
      args:
        # `:-`, never `:?`: compose interpolates the WHOLE file on EVERY
        # command, so a `${VAR:?}` here would make `docker compose restart
        # postgres` fail on a missing UI variable. `Dockerfile.ui` refuses to
        # build without the API URL instead.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WORKOS_CLIENT_ID: ${VITE_WORKOS_CLIENT_ID:-}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      # :80 must stay published even though everything redirects to https --
      # it is where the ACME HTTP challenge lands, so closing it breaks renewal.
      - "443:443"
      - "443:443/udp"   # HTTP/3
      - "8000:8000"
    volumes:
      # Certificates and the ACME account key. Without these the container's
      # writable layer holds them, every `build` throws them away, and Caddy
      # re-requests certificates on each deploy -- Let's Encrypt allows five
      # duplicate certificates per week, so the sixth UI deploy in a week would
      # take the site down with a TLS error rather than a 500.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  agentpit_pg:
  # External, under the testnet project's names: the mainnet stack took over
  # the live certificates and ACME account at the cutover instead of asking
  # Let's Encrypt for new ones. The volumes still belong to the `agentpit`
  # project, so never `down -v` that project.
  caddy_data:
    external: true
    name: agentpit_caddy_data
  caddy_config:
    external: true
    name: agentpit_caddy_config
