# Production stack — single instance, one shared server-side .env at the repo
# root (compose --env-file AND deploy_exchange.sh read it).
#
#   cd /root/dev/agentpit
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env build
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d postgres anvil
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env run --rm chain-init
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d api caddy
#
# Only caddy publishes ports (80 UI, 8000 API). postgres and anvil stay on the
# internal network — anvil especially must NEVER be published (unlocked
# accounts + operator key).
name: agentpit

# Log rotation is NOT optional here: anvil logs every RPC call and the liquidity
# mirror re-quotes ~1000 books continuously (~170 lines/s between them). Without
# a cap the two json logs reached 32 GB and 24 GB in 12 days and filled the disk
# to 97%, which would have taken Postgres down with it. 50m x 3 per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: agentpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: agentpit
    volumes:
      - agentpit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpit"]
      interval: 3s
      timeout: 3s
      retries: 20

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    restart: unless-stopped
    logging: *default-logging
    # The image runs as uid 1000 (foundry), but Docker creates the mountpoint
    # for a named volume root-owned when the path doesn't exist in the image —
    # so anvil could not write /state/anvil-state.json and its periodic dump
    # failed SILENTLY. The chain looked healthy for 12 days and was wiped clean
    # by the first container recreate. Run as root so the dump always lands.
    user: root
    entrypoint:
      - anvil
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "31337"
      - --state
      - /state/anvil-state.json
      - --state-interval
      - "30"
    volumes:
      - agentpit_anvil:/state
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: deploys CTF + AgentpitUSD + Faucet + CTFExchange to anvil and
  # writes deployments/local.json into the bind-mounted repo. Run once per
  # fresh chain (profile keeps it out of plain `up`).
  chain-init:
    profiles: ["init"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.chain-init
    command: ["scripts/deploy_exchange.sh"]
    volumes:
      - ..:/repo
    depends_on:
      anvil:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../.env
    environment:
      AGENTPIT_DATABASE_URL: postgresql://agentpit:${POSTGRES_PASSWORD}@postgres:5432/agentpit
      # The local anvil is the DEFAULT, not the law. This line used to be a
      # bare `http://anvil:8545`, and an `environment:` entry beats `env_file`,
      # so a deployment that had moved to a real chain in .env silently kept
      # talking to the sidecar. On the SKALE cutover that surfaced as
      # `Connected chain_id 31337 != deployment chain_id 324705682` -- caught
      # only because `verify_chain()` refuses to start on a mismatch.
      RPC_URL: ${RPC_URL:-http://anvil:8545}
    volumes:
      - ../deployments:/app/deployments:ro
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
      args:
        # All `:-`, none `:?`, and that is deliberate. Compose interpolates the
        # WHOLE file on EVERY command, so a `${VAR:?}` here does not merely
        # guard the build -- it makes `docker compose restart anvil` fail on a
        # missing UI variable. That bit during this migration: an incident
        # recreate was refused for a value the recreated service never reads.
        #
        # The requirement did not go away, it moved to where it belongs:
        # `Dockerfile.ui` refuses to build without these two, with a message
        # naming what breaks. A missing value now costs a failed build instead
        # of a system that cannot be operated.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        # Baked in, not read at runtime -- see Dockerfile.ui.
        VITE_WORKOS_CLIENT_ID: ${VITE_WORKOS_CLIENT_ID:-}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      # :80 must stay published even though everything redirects to https --
      # it is where the ACME HTTP challenge lands, so closing it breaks renewal.
      - "443:443"
      - "443:443/udp"   # HTTP/3
      - "8000:8000"
    volumes:
      # Certificates and the ACME account key. Without these the container's
      # writable layer holds them, every `build` throws them away, and Caddy
      # re-requests certificates on each deploy -- Let's Encrypt allows five
      # duplicate certificates per week, so the sixth UI deploy in a week would
      # take the site down with a TLS error rather than a 500.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  agentpit_pg:
  agentpit_anvil:
  caddy_data:
  caddy_config:
